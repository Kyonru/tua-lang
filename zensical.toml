[project]
repo_url = "https://github.com/Kyonru/tua-lang"
repo_name = "Kyonru/tua-lang"
site_name = "Tua"
site_description = "Typed Lua source-to-source tooling for LuaJIT and LOVE projects."
site_author = "Kyonru"
site_url = "https://kyonru.github.io/tua-lang"

copyright = """
Copyright &copy; 2026 Kyonru
"""

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
    { "Learn" = "learn.md" },
    { "Configuration" = "configuration.md" },
    { "Examples" = "examples.md" },
  ] },
  { "Language" = [
    { "Overview" = "language.md" },
    { "Typing" = "typing.md" },
    { "Toolchain Reference" = "specification.md" },
    { "Lua Interop" = "lua-interop.md" },
    { "State Stores" = "stores.md" },
    { "State Machines" = "state-machines.md" },
    { "Input" = "input.md" },
    { "Entity Component Systems" = "ecs.md" },
    { "Object Pooling" = "object-pooling.md" },
  ] },
  { "Tooling" = [
    { "CLI" = "cli.md" },
    { "Formatter" = "formatter.md" },
    { "Linter" = "linter.md" },
    { "Language Server" = "lsp.md" },
    { "Debugging" = "debugging.md" },
    { "Diagnostic Codes" = "luahelper-code-matrix.md" },
    { "Completion Benchmark Guide" = "completion-benchmarks.md" },
    { "External API And MCP" = "external-api-bridge.md" },
  ] },
  { "Project" = [
    { "Releases" = "releases.md" },
    { "Architecture" = "architecture.md" },
  ] },
]

extra_css = ["assets/code-compare.css"]

[project.theme]
language = "en"
favicon = "assets/icon.svg"
logo = "assets/icon.png"

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Kyonru/tua-lang"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions."docs_support.tua_highlight"]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.quotes]
callouts = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
