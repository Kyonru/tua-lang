# Generated by `tua actions init`. Review before committing to your game repository.
name: Tua game packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install pinned Tua CLI
        run: cargo install --git https://github.com/Kyonru/tua-lang.git --tag v@TUA_VERSION@ --locked --root "$RUNNER_TEMP/tua" tua-cli
      - name: Check and package game
        run: |
          "$RUNNER_TEMP/tua/bin/tua" check
          "$RUNNER_TEMP/tua/bin/tua" package --target love
      - name: Keep downloadable game artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: love-game
          path: dist/*.love
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the checked package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: love-game
          path: release
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(release/*.love)
          if ((${#packages[@]} == 0)); then
            echo '::error::The downloaded artifact contains no .love package'
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]]; then
              echo '::error::The release is already published; review it manually'
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" --draft --generate-notes --verify-tag
          fi
