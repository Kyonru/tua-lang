# Generated by `tua actions init`. Review before committing to your game repository.
name: Tua game packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Install pinned Tua CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="@TUA_VERSION@"
          archive="tua-${version}-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/Kyonru/tua-lang/releases/download/v${version}"
          install_dir="$RUNNER_TEMP/tua"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --silent --show-error \
            "$release/$archive" -o "$install_dir/$archive"
          curl --fail --location --retry 3 --silent --show-error \
            "$release/$archive.sha256" -o "$install_dir/$archive.sha256"
          (cd "$install_dir" && sha256sum --check "$archive.sha256")
          gh attestation verify "$install_dir/$archive" \
            --repo Kyonru/tua-lang \
            --signer-workflow Kyonru/tua-lang/.github/workflows/release.yml
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          cli="$install_dir/tua-${version}-x86_64-unknown-linux-gnu/tua"
          test "$("$cli" --version)" = "tua ${version}"
          echo "$(dirname "$cli")" >> "$GITHUB_PATH"
      - name: Check and package game
        run: |
          tua check
          tua package --target love
      - name: Keep downloadable game artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: love-game
          path: dist/*.love
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the checked package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: love-game
          path: release
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(release/*.love)
          if ((${#packages[@]} == 0)); then
            echo '::error::The downloaded artifact contains no .love package'
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]]; then
              echo '::error::The release is already published; review it manually'
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" --draft --generate-notes --verify-tag
          fi
