[package]
name = "tua-core"
description = "Compiler, semantic analysis, and editor intelligence for the Tua typed Lua language"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
test-fixture = ["dep:sha2"]

[[example]]
name = "inline_eval"
required-features = ["test-fixture"]

[dependencies]
full_moon = { version = "2.2.0", features = ["luau", "luajit"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10.9", optional = true }
toml = "0.9.12"
toml_edit = "0.25.13"

[dev-dependencies]
proptest = "=1.12.0"
sha2 = "0.10.9"
