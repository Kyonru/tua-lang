name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check formatting
        run: make fmt-check
      - name: Run strict Clippy
        run: make clippy
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: make rust-audit
      - name: Validate JSON
        run: make json-check
      - name: Check synchronized package version
        run: make version-drift-check
      - name: Test release packaging tools
        run: make release-tool-test
      - name: Check generated config metadata
        run: make config-schema-drift-check
      - name: Verify LLM language evaluation corpus
        run: make llm-language-eval-test
      - name: Build documentation
        env:
          TUA_DOCS_VENV_DIR: ${{ runner.temp }}/tua-docs
        run: make docs-build
      - name: Check whitespace
        run: make diff-check

  platform-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install Lua and LOVE runtime test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y luajit love xvfb xauth
      - name: Install LOVE debugger adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          debugger_version="$(cat editors/vscode/scripts/love-debugger-version.txt)"
          debugger_archive="${RUNNER_TEMP}/second-local-lua-debugger.vsix"
          debugger_directory="${RUNNER_TEMP}/second-local-lua-debugger"
          curl --compressed -fsSL \
            -o "${debugger_archive}" \
            "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ismoh-games/vsextensions/second-local-lua-debugger-vscode/${debugger_version}/vspackage"
          echo "$(cat editors/vscode/scripts/love-debugger-sha256.txt)  ${debugger_archive}" | sha256sum --check
          mkdir -p "${debugger_directory}"
          unzip -q "${debugger_archive}" -d "${debugger_directory}"
          echo "TUA_DEBUGGER_EXTENSION_PATH=${debugger_directory}/extension" >> "${GITHUB_ENV}"
      # The upstream LOVE 11.5 macOS bundle is not signed or notarized. Do not
      # bypass Gatekeeper to install it on a hosted runner. Linux exercises the
      # real debugger/runtime path with the distribution-trusted LOVE package.
      - name: Test workspace
        env:
          # Match the explicit analysis-thread stack used by the CLI and LSP.
          # Windows test threads otherwise default too low for debug AST walks.
          RUST_MIN_STACK: "8388608"
          # Run emitted-Lua and runtime fixtures on the LuaJIT target. A pinned
          # interpreter fails the tests when missing instead of skipping them.
          TUA_LUAJIT_BIN: ${{ runner.os == 'Linux' && 'luajit' || '' }}
        run: cargo test --workspace
      - name: Test bundled runtimes on LuaJIT
        if: runner.os == 'Linux'
        run: make runtime-test LUA=luajit
      - name: Build love-minimal
        working-directory: examples/love-minimal
        run: cargo run --quiet --package tua-cli -- build
      - name: Build love-full
        working-directory: examples/love-full
        run: cargo run --quiet --package tua-cli -- build
      - name: Build love-tua
        working-directory: examples/love-tua
        run: cargo run --quiet --package tua-cli -- build
      - name: Build audio-system
        working-directory: examples/audio-system
        run: cargo run --quiet --package tua-cli -- build
      - name: Build feature examples
        working-directory: examples/features
        run: cargo run --quiet --package tua-cli -- build
      - name: Build project-model
        working-directory: examples/project-model
        run: cargo run --quiet --package tua-cli -- build
      - name: Exercise editor regression smoke
        run: make editor-regression-smoke
      - name: Hit a source-mapped Tua breakpoint in LOVE
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum make love-debugger-e2e LOVE=love

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode
      - name: Audit extension dependencies
        run: npm audit --prefix editors/vscode --audit-level=high
      - name: Check extension
        run: make extension-check
      - name: Test extension host
        run: xvfb-run --auto-servernum npm --prefix editors/vscode run test:vscode
      - name: Test extension with the real server
        run: xvfb-run --auto-servernum make extension-real-server-test

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Exercise benchmark fixtures and harness
        id: benchmark
        run: make benchmark-smoke
      - name: Upload smoke report
        if: steps.benchmark.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-${{ github.run_id }}
          path: |
            target/tua-speed/examples-profile-smoke.json
            target/tua-speed/representative-profile-smoke.json
          if-no-files-found: error
          retention-days: 14

  love-api-catalog:
    name: Generated LOVE catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check out pinned LOVE API
        run: |
          git clone --filter=blob:none https://github.com/love2d-community/love-api.git /tmp/love-api
          git -C /tmp/love-api checkout "$(cat scripts/love-api-revision.txt)"
      - name: Check generated LOVE catalog
        run: make love-api-drift-check LOVE_API_ROOT=/tmp/love-api
