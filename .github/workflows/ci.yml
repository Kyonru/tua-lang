name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check formatting
        run: make fmt-check
      - name: Run strict Clippy
        run: make clippy
      - name: Validate JSON
        run: make json-check
      - name: Check synchronized package version
        run: make version-drift-check
      - name: Test release packaging tools
        run: make release-tool-test
      - name: Check generated config metadata
        run: make config-schema-drift-check
      - name: Build documentation
        env:
          TUA_DOCS_VENV_DIR: ${{ runner.temp }}/tua-docs
        run: make docs-build
      - name: Check whitespace
        run: make diff-check

  platform-tests:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Lua for runtime traceback tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install LOVE debugger end-to-end dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install --cask love
          debugger_version="$(cat editors/vscode/scripts/love-debugger-version.txt)"
          debugger_archive="${RUNNER_TEMP}/second-local-lua-debugger.vsix"
          debugger_directory="${RUNNER_TEMP}/second-local-lua-debugger"
          curl --compressed -fsSL \
            -o "${debugger_archive}" \
            "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ismoh-games/vsextensions/second-local-lua-debugger-vscode/${debugger_version}/vspackage"
          echo "$(cat editors/vscode/scripts/love-debugger-sha256.txt)  ${debugger_archive}" | shasum -a 256 -c -
          mkdir -p "${debugger_directory}"
          unzip -q "${debugger_archive}" -d "${debugger_directory}"
          echo "TUA_DEBUGGER_EXTENSION_PATH=${debugger_directory}/extension" >> "${GITHUB_ENV}"
      - name: Test workspace
        env:
          # Match the explicit analysis-thread stack used by the CLI and LSP.
          # Windows test threads otherwise default too low for debug AST walks.
          RUST_MIN_STACK: "8388608"
        run: cargo test --workspace
      - name: Build love-minimal
        working-directory: examples/love-minimal
        run: cargo run --quiet --package tua-cli -- build
      - name: Build love-full
        working-directory: examples/love-full
        run: cargo run --quiet --package tua-cli -- build
      - name: Build feature examples
        working-directory: examples/features
        run: cargo run --quiet --package tua-cli -- build
      - name: Build project-model
        working-directory: examples/project-model
        run: cargo run --quiet --package tua-cli -- build
      - name: Exercise editor regression smoke
        run: make editor-regression-smoke
      - name: Hit a source-mapped Tua breakpoint in LOVE
        if: runner.os == 'macOS'
        run: make love-debugger-e2e LOVE=/Applications/love.app/Contents/MacOS/love

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode
      - name: Check extension
        run: make extension-check
      - name: Test extension host
        run: xvfb-run --auto-servernum npm --prefix editors/vscode run test:vscode

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Exercise benchmark fixtures and harness
        run: make benchmark-smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-smoke-${{ github.run_id }}
          path: |
            target/tua-speed/examples-profile-smoke.json
            target/tua-speed/representative-profile-smoke.json
          if-no-files-found: error
          retention-days: 14

  love-api-catalog:
    name: Generated LOVE catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check out pinned LOVE API
        run: |
          git clone --filter=blob:none https://github.com/love2d-community/love-api.git /tmp/love-api
          git -C /tmp/love-api checkout "$(cat scripts/love-api-revision.txt)"
      - name: Check generated LOVE catalog
        run: make love-api-drift-check LOVE_API_ROOT=/tmp/love-api
