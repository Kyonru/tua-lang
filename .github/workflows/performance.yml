name: Performance trends

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Compiler and LSP profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run compiler and LSP profiles
        run: make profile-lsp profile-completion profile-examples
      - name: Upload profile reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-general-${{ github.sha }}-${{ github.run_id }}
          path: target/tua-speed/*.json
          if-no-files-found: error
          retention-days: 90

  representative:
    name: Representative profiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run representative profiles
        run: make profile-representative
        env:
          # project-1000 remains part of the local profile-all suite, but a
          # single run peaks above the memory available on GitHub's standard
          # hosted runner. The hosted trend still covers large files, a
          # 100-file project, and 256-module graph shapes.
          TUA_REPRESENTATIVE_FIXTURES: single-1000,single-5000,project-100,graph-chain-256,graph-diamond-256,graph-cycles-64
          TUA_REPRESENTATIVE_COLD_REPEAT: 2
          TUA_REPRESENTATIVE_WARM_REPEAT: 5
          TUA_REPRESENTATIVE_CONTENTION_REPEAT: 3
          TUA_REPRESENTATIVE_BACKGROUND_BURST: 32
          TUA_LSP_REQUEST_TIMEOUT_MS: 180000
          TUA_REPRESENTATIVE_COMPLETION_P95_BUDGET_MS: 60000
          TUA_REPRESENTATIVE_PROFILE_OUT: target/tua-speed/representative-profile.json
      - name: Upload representative report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-representative-${{ github.sha }}-${{ github.run_id }}
          path: target/tua-speed/representative-profile.json
          if-no-files-found: error
          retention-days: 90
