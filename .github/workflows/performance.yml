name: Performance trends

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Full profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full profiles
        run: make profile-all
      - name: Upload profile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}-${{ github.run_id }}
          path: target/tua-speed/*.json
          if-no-files-found: error
          retention-days: 90
