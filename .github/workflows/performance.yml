name: Performance trends

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Full profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run full profiles
        run: make profile-all
        env:
          # The full representative profile is a trend artifact, and GitHub's
          # shared runners are substantially slower on the generated 5k file.
          # PR freshness gating remains at 2.5s in benchmark-smoke.
          TUA_REPRESENTATIVE_COMPLETION_P95_BUDGET_MS: 30000
      - name: Upload profile reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-${{ github.sha }}-${{ github.run_id }}
          path: target/tua-speed/*.json
          if-no-files-found: error
          retention-days: 90
