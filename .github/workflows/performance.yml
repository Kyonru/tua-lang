name: Performance trends

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Compiler and LSP profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Run compiler and LSP profiles
        run: make profile-lsp profile-completion profile-examples
      - name: Upload profile reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: performance-general-${{ github.sha }}-${{ github.run_id }}
          path: target/tua-speed/*.json
          if-no-files-found: error
          retention-days: 90

  representative:
    name: Representative profiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Run representative profiles
        run: make profile-representative
        env:
          TUA_REPRESENTATIVE_FIXTURES: single-1000,single-5000,project-100,project-1000,graph-chain-256,graph-diamond-256,graph-cycles-64
          TUA_REPRESENTATIVE_COLD_REPEAT: 2
          TUA_REPRESENTATIVE_WARM_REPEAT: 20
          TUA_REPRESENTATIVE_CONTENTION_REPEAT: 20
          TUA_REPRESENTATIVE_BACKGROUND_BURST: 32
          TUA_LSP_REQUEST_TIMEOUT_MS: 180000
          TUA_REPRESENTATIVE_COMPLETION_P95_BUDGET_MS: 3000
          TUA_REPRESENTATIVE_WARM_COMPLETION_P95_BUDGET_MS: 500
          TUA_REPRESENTATIVE_MEMORY_BUDGET_MIB: 4096
          TUA_REPRESENTATIVE_PROFILE_OUT: target/tua-speed/representative-profile.json
      - name: Upload representative report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: performance-representative-${{ github.sha }}-${{ github.run_id }}
          path: target/tua-speed/representative-profile.json
          if-no-files-found: error
          retention-days: 90
