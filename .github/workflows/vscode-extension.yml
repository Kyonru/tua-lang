name: VS Code extension publish

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

jobs:
  publish-vs-marketplace:
    name: Publish to Visual Studio Marketplace
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
    steps:
      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "expected release tag like v0.1.0, got '${RELEASE_TAG}'" >&2
            exit 1
          fi
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "missing VS_MARKETPLACE_TOKEN secret" >&2
            exit 1
          fi

      - name: Download release VSIX assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern "tua-*.vsix"
          ls -1 dist/*.vsix

      - name: Publish VSIX packages
        shell: bash
        run: |
          set -euo pipefail
          for vsix in dist/*.vsix; do
            echo "publishing ${vsix}"
            npx --yes @vscode/vsce publish --packagePath "${vsix}"
          done

  publish-open-vsx:
    name: Publish to Open VSX
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "expected release tag like v0.1.0, got '${RELEASE_TAG}'" >&2
            exit 1
          fi
          if [[ -z "${OVSX_PAT}" ]]; then
            echo "missing OPEN_VSX_TOKEN secret" >&2
            exit 1
          fi

      - name: Download release VSIX assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern "tua-*.vsix"
          ls -1 dist/*.vsix

      - name: Publish VSIX packages
        shell: bash
        run: |
          set -euo pipefail
          for vsix in dist/*.vsix; do
            echo "publishing ${vsix}"
            npx --yes ovsx publish --packagePath "${vsix}"
          done
