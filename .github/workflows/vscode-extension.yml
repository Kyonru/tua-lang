name: VS Code extension publish

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

jobs:
  publish-vs-marketplace:
    name: Publish to Visual Studio Marketplace
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install pinned publishing tools
        run: npm ci --prefix editors/vscode
      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "expected release tag like v0.1.0, got '${RELEASE_TAG}'" >&2
            exit 1
          fi

      - name: Download and verify release VSIX assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern "tua-*.vsix"
          gh release download "${RELEASE_TAG}" --dir dist --pattern SHA256SUMS
          sed -i 's/\r$//' dist/SHA256SUMS
          for vsix in dist/*.vsix; do
            checksum="$(sha256sum "${vsix}" | cut -d ' ' -f 1)  $(basename "${vsix}")"
            grep -Fqx "${checksum}" dist/SHA256SUMS || {
              echo "missing or invalid release checksum for ${vsix}" >&2
              exit 1
            }
          done

      - name: Publish VSIX packages
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "missing VS_MARKETPLACE_TOKEN secret" >&2
            exit 1
          fi
          for vsix in dist/*.vsix; do
            echo "publishing ${vsix}"
            editors/vscode/node_modules/.bin/vsce publish --packagePath "${vsix}"
          done

  publish-open-vsx:
    name: Publish to Open VSX
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install pinned publishing tools
        run: npm ci --prefix editors/vscode
      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "expected release tag like v0.1.0, got '${RELEASE_TAG}'" >&2
            exit 1
          fi

      - name: Download and verify release VSIX assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern "tua-*.vsix"
          gh release download "${RELEASE_TAG}" --dir dist --pattern SHA256SUMS
          sed -i 's/\r$//' dist/SHA256SUMS
          for vsix in dist/*.vsix; do
            checksum="$(sha256sum "${vsix}" | cut -d ' ' -f 1)  $(basename "${vsix}")"
            grep -Fqx "${checksum}" dist/SHA256SUMS || {
              echo "missing or invalid release checksum for ${vsix}" >&2
              exit 1
            }
          done

      - name: Publish VSIX packages
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OVSX_PAT}" ]]; then
            echo "missing OPEN_VSX_TOKEN secret" >&2
            exit 1
          fi
          for vsix in dist/*.vsix; do
            echo "publishing ${vsix}"
            editors/vscode/node_modules/.bin/ovsx publish --packagePath "${vsix}"
          done
