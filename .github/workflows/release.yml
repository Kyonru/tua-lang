name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Check synchronized versions
        run: make version-drift-check
      - name: Test release packaging tools
        run: make release-tool-test
      - name: Validate tag and changelog
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/sync-version.js --print)"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "release must run from tag v${VERSION}" >&2
            exit 1
          fi
          python3 scripts/package_release.py notes \
            --changelog CHANGELOG.md \
            --version "${VERSION}" \
            --output "${RUNNER_TEMP}/release-notes.md"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Run trusted release gates
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Package ${{ matrix.target }}
    needs: [validate, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: tua
            vsce: linux-x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: tua.exe
            vsce: win32-x64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: tua
            vsce: darwin-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: tua
            vsce: darwin-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install extension packaging dependencies
        run: npm ci --prefix editors/vscode
      - name: Build release server
        run: cargo build --release --locked --package tua-cli --target ${{ matrix.target }}
      - name: Smoke release server
        shell: bash
        run: |
          output="$("target/${{ matrix.target }}/release/${{ matrix.executable }}" --version)"
          test "${output}" = "tua ${{ needs.validate.outputs.version }}"
      - name: Stage server for VSIX
        shell: bash
        run: |
          mkdir -p editors/vscode/bin
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            "editors/vscode/bin/${{ matrix.executable }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod 755 "editors/vscode/bin/${{ matrix.executable }}"
          fi
      - name: Create standalone server archive
        shell: bash
        run: |
          python3 scripts/package_release.py archive \
            --repo-root . \
            --binary "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --output dist
      - name: Create platform VSIX
        shell: bash
        run: |
          cd editors/vscode
          # vsce resolves README links against the repository root and ignores the
          # editors/vscode subdirectory; pin them to this release's tag instead.
          base="https://github.com/${{ github.repository }}"
          npx --no-install vsce package \
            --target "${{ matrix.vsce }}" \
            --baseContentUrl "${base}/blob/v${{ needs.validate.outputs.version }}/editors/vscode" \
            --baseImagesUrl "${base}/raw/v${{ needs.validate.outputs.version }}/editors/vscode" \
            --out "../../dist/tua-${{ needs.validate.outputs.version }}-${{ matrix.vsce }}.vsix"
      - name: Checksum VSIX
        shell: bash
        run: |
          python3 scripts/package_release.py checksum \
            "dist/tua-${{ needs.validate.outputs.version }}-${{ matrix.vsce }}.vsix"
      - name: Exercise packaged servers
        shell: bash
        run: |
          suffix=tar.gz
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=zip; fi
          python3 scripts/smoke_release.py \
            --archive "dist/tua-${{ needs.validate.outputs.version }}-${{ matrix.target }}.${suffix}" \
            --vsix "dist/tua-${{ needs.validate.outputs.version }}-${{ matrix.vsce }}.vsix" \
            --version "${{ needs.validate.outputs.version }}" --target "${{ matrix.target }}"
      - name: Install and exercise packaged VSIX
        if: runner.os == 'Linux'
        env:
          TUA_TEST_VSIX: ${{ github.workspace }}/dist/tua-${{ needs.validate.outputs.version }}-${{ matrix.vsce }}.vsix
        run: xvfb-run --auto-servernum node editors/vscode/test/real-server/run.js
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release checksums
        shell: bash
        run: |
          sed 's/\r$//' dist/*.sha256 | sort > dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
      - name: Build release notes
        run: |
          python3 scripts/package_release.py notes \
            --changelog CHANGELOG.md \
            --version "${{ needs.validate.outputs.version }}" \
            --output release-notes.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.validate.outputs.version }}" \
            dist/* \
            --verify-tag \
            --title "Tua ${{ needs.validate.outputs.version }}" \
            --notes-file release-notes.md
