# Aggregate Phase 1 acceptance state. A dataset quality gate passing is not
# enough to advance or enable the feature.
#
# A passed prerequisite names the report it was read from (`artifact`,
# relative to the repository root) and the commit that report records
# (`revision`). `make inline-eval-phase-gate-check` rejects it unless that
# report was produced from a clean tree at that commit and no shipped code,
# harness, or benchmark input has changed since. It also names the entry in
# that report's `checks` map (`check`) that decides the prerequisite.
version = 2

[prerequisites.heldout_quality]
passed = false
evidence = "not run; frozen held-out data remains unspent"

[prerequisites.external_quality]
passed = false
evidence = "not run; frozen external data remains unspent"

[prerequisites.menu_replay]
passed = false
evidence = "pending: rerun `make inline-editor-replay` on a clean tree. The 95c9000 run (4/4 curated captures, 1 selected-menu and 3 closed-menu) predates revision binding and only proves plumbing, not menu-state frequency"

[prerequisites.completion_performance]
passed = false
evidence = "the 100-repeat completion p95 at 6df7118 is 6.34 ms against 5.38 ms for pre-Phase-1 commit 65cb4a6 on the same machine (+17.8%; exact 5% allows 5.65 ms). Single sequential runs; confirm with interleaved reruns before attributing the cause"
artifact = "target/tua-speed/completion-phase1-gate.json"
revision = "6df711848e68"
check = "completionBaseline"

[prerequisites.inline_server_performance]
passed = true
evidence = "dispatch-to-response p95 0-1 ms, worker p95 at most 1.37 ms, and core/backend p95 at most 1.36 ms across seven fixtures, each within its 10 ms budget. Three fixtures' active files exceed the parse cap, so their inline requests are refused before generation (skippedOversized 3 each) and measure only that refusal"
artifact = "target/tua-speed/representative-phase1-gate.json"
revision = "6df711848e68"
check = "inlineServerPerformance"

[prerequisites.inline_client_no_stall]
passed = true
evidence = "client-observed contended request-age p95 59.2, 370.4, 31.3, 738.4, 32.1, 9.4, and 17.3 ms, all within the 1,500 ms stall ceiling"
artifact = "target/tua-speed/representative-phase1-gate.json"
revision = "6df711848e68"
check = "inlineClientNoStall"

[prerequisites.inline_contended_delivery]
passed = false
evidence = "contended request-age p95 is 370.4 ms on single-5000 and 738.4 ms on project-1000, beyond the 250 ms client timeout, so the editor discards those results under load. Both active files are refused as oversized, so the delay is queueing behind other work, not inline computation"
artifact = "target/tua-speed/representative-phase1-gate.json"
revision = "6df711848e68"
check = "inlineContendedDelivery"

[prerequisites.inline_client_responsiveness]
passed = false
evidence = "pending: rerun `make inline-editor-replay` on a clean tree. The unbound 95c9000 run cancelled the delayed local request after 251.08 ms and rendered no late ghost text"

[prerequisites.diagnostics_freshness]
passed = false
evidence = "pending: the 2026-10-22 comparison against 65cb4a6 finished on a tree another session was editing, so its report is dirty and does not count. It recorded single-1000 (71.87 vs 69.62 ms allowed) and single-5000 (411.80 vs 394.29 ms allowed) over the allowance; rerun `make representative-diagnostics-baseline` on a clean tree"

[prerequisites.scheduler_cache_hit]
passed = true
evidence = "negative result: the cache peek was observed 21 times under real scheduling and never hit, so Phase 1 ships no candidate that depends on cached analysis. Passing means that decision is supported, not that the cache helps"
artifact = "target/tua-speed/representative-phase1-gate.json"
revision = "6df711848e68"
check = "inlineCachePeekObserved"

[prerequisites.validation_parse_distribution]
passed = false
evidence = "the tuning run of the production host returned 239 candidates: 106 after one parse and 133 after two (44.4% at most one parse; 50% required), averaging 1.72 parses per validation. One-parse validation is not the common case"
artifact = "target/tua-speed/inline-eval-tune.json"
revision = "6df711848e68"
check = "validationParseDistribution"
