# Phase 1 acceptance criteria. Commit this file before running any held-out
# or external evaluation, then run each gate once. Changing it after seeing
# gate results spends the held-out data.
#
# PROVISIONAL, UNSPENT CANDIDATE: the held-out and external sets have not been
# run. The exact production backend on the tuning set currently reaches 0.823
# Lua / 0.707 Tua correct-prefix precision and 0.236 / 0.094 characters saved
# per eligible position. Tua is therefore still below the 0.10 quality floor;
# these limits are not a claim that Phase 1 passes. Commit/freeze the final
# candidate before running either quality gate, then do not change it after
# seeing those results.
#
# Each gate set names the languages that dataset is intended to measure. A
# missing set, backend, configured language, eligible request, minimum number
# of suggestions, or language limit fails.

# The backend that has to pass.
backend = "phase1"

# The exact Phase 1 configuration evaluated by quality gates. These values
# must match the shipping policy. The evaluator rejects a mismatched table.
[phase1]
recall_variant = "common-prefix"
contexts = ["open-paren", "comma", "operator", "whitespace", "statement-prefix", "identifier", "other"]
min_prefix_chars = 6
min_support = 1
min_full_prefix_support = 2
dominance_ratio = 2.0
love_callbacks = false
statement_snippets = true
snippet_min_prefix_chars = 3

# Frozen tuning policy for the evaluator-only Phase 2 candidate. This is not a
# release threshold and must be selected on tune/smoke before any Phase 2
# held-out or external run. The candidate keeps Phase 1 results first, then
# uses only rest-of-project common-prefix evidence in these contexts.
[phase2_tuning]
contexts = ["comma", "operator", "other"]
min_prefix_chars = 6
min_support = 2
min_full_prefix_support = 2

[sets.holdout.languages.tua]
# Enough suggestions for a meaningful verdict: at about 100, a measured
# precision is accurate to roughly +/-10 points.
min_suggestions = 100
# Of the suggestions shown, the share that are right as far as they go.
min_correct_prefix_precision = 0.60
# Characters a user deletes for every character a suggestion saves; above 1,
# the source costs more typing than it saves.
max_wrong_to_saved_ratio = 1.0
# A floor on usefulness, averaged over every eligible request.
min_chars_saved_per_eligible = 0.10
# Core backend time for one request; server/request latency is gated separately.
max_backend_latency_p95_ms = 10.0

[sets.external.languages.lua]
min_suggestions = 100
min_correct_prefix_precision = 0.60
max_wrong_to_saved_ratio = 1.0
min_chars_saved_per_eligible = 0.10
max_backend_latency_p95_ms = 10.0
