[workspace]
members = [
  "crates/tua-core",
  "crates/tua-cli",
  "crates/tua-lsp",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Kyonru/tua-lang"
homepage = "https://kyonru.github.io/tua-lang"
keywords = ["lua", "love2d", "luajit", "language-server"]
categories = ["compilers", "development-tools"]
version = "0.2.7"
