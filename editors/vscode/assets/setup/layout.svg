  <text class="text" x="32" y="258">Editor actions and layout controls share the title bar.</text>
  <text class="muted" x="32" y="296">Extra Tua commands stay in the Tools menu.</text>
  <text class="muted" x="32" y="354">Restore your previous layout at any time.</text>
